
name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump_version:
    name: Bump Maven version and create release
    runs-on: ubuntu-latest
    needs: push_to_registry
    if: ${{ success() }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Determine bump type
        id: bump
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Bump Maven version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION%-SNAPSHOT}"

          case "${{ steps.bump.outputs.bump }}" in
            major)
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR+1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH+1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          mvn versions:set -DnewVersion=$NEW_VERSION
          mvn versions:commit

          echo "version=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/version-${{ env.version }}
          base: main
          commit-message: "chore(release): ${{ env.version }}"
          title: "chore(release): ${{ env.version }}"
          body: |
            Automated version bump to **${{ env.version }}**
            Triggered after successful Docker image publish.
